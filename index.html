<style>
:root {
  --cream: #f4e6c9;
  --gold: #c99a45;
  --brown: #32190e;
  --dark: #1c0c06;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(255,242,216,.98) 0%, rgba(237,216,177,.98) 58%, rgba(179,128,65,.96) 100%);
  color: var(--brown);
  font-family: Georgia, "Times New Roman", serif;
}
.poster {
  position: relative;
  isolation: isolate;
  width: min(100%, 1100px);
  min-height: min(94vh, 1200px);
  padding: clamp(28px, 5vw, 64px) clamp(18px, 5vw, 58px);
  overflow: hidden;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(255,248,229,.98), rgba(232,207,164,.96) 72%),
    #f4e6c9;
  border: 1px solid rgba(132,83,36,.45);
  box-shadow: 0 28px 80px rgba(57,27,9,.3);
}
.poster::before, .poster::after {
  content: "";
  position: absolute;
  z-index: -1;
  pointer-events: none;
  border: 2px solid rgba(161,105,42,.25);
}
.poster::before {
  inset: 12px;
  border-left: 0;
  border-right: 0;
}
.poster::after {
  inset: 22px;
  border-top: 0;
  border-bottom: 0;
}
.corner {
  position: absolute;
  z-index: -1;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  filter: blur(1px);
  opacity: .12;
  background: radial-gradient(circle, #4b2410 0%, #4b2410 20%, transparent 70%);
}
.corner.left { left: -100px; bottom: 7%; }
.corner.right { right: -100px; top: 5%; }
.kicker {
  margin: 0 0 18px;
  color: #8b5727;
  font: 600 11px/1.5 Arial, sans-serif;
  letter-spacing: .38em;
  text-transform: uppercase;
}
.logo {
  display: block;
  width: min(82%, 620px);
  height: auto;
  object-fit: contain;
  margin: 0 auto 28px;
  padding: clamp(12px, 2.2vw, 24px);
  border-radius: 10px;
  background:
    linear-gradient(135deg, rgba(93,48,25,.97), rgba(35,15,8,.99) 55%, rgba(70,34,17,.98));
  box-shadow:
    inset 0 1px rgba(255,230,180,.18),
    0 14px 34px rgba(53,25,10,.24);
  border: 1px solid rgba(185,133,59,.75);
}
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  width: min(100%, 620px);
  color: #805027;
  font: 500 12px/1.5 Arial, sans-serif;
  letter-spacing: .38em;
  text-transform: uppercase;
  margin: 0 auto 28px;
}
.divider::before, .divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, #b5823d);
}
.divider::after { background: linear-gradient(90deg, #b5823d, transparent); }
h1 {
  max-width: 850px;
  margin: 0 auto 18px;
  font-size: clamp(36px, 7.1vw, 82px);
  line-height: 1.03;
  font-weight: 600;
  letter-spacing: .045em;
  color: #3b1d0d;
  text-wrap: balance;
}
h1 .second {
  display: block;
  font-size: 1.13em;
}
.gold-text { color: #a9772d; }
.tagline {
  margin: 0 auto 34px;
  color: #674022;
  font: 500 12px/1.7 Arial, sans-serif;
  letter-spacing: .3em;
  text-transform: uppercase;
}
.timer {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(8px, 1.7vw, 18px);
  width: min(100%, 790px);
}
.unit {
  min-width: 0;
  padding: clamp(15px, 3vw, 26px) 5px clamp(13px, 2vw, 20px);
  border: 1px solid #d3a454;
  border-radius: 18px;
  color: var(--cream);
  background:
    linear-gradient(145deg, #4b2815 0%, #241006 58%, #160904 100%);
  box-shadow: inset 0 1px rgba(255,255,255,.14), 0 8px 15px rgba(67,36,13,.22);
}
.number {
  display: block;
  font: 500 clamp(30px, 6.7vw, 72px)/1.08 Georgia, "Times New Roman", serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.04em;
  color: #f3d8a0;
}
.label {
  display: block;
  margin-top: 12px;
  font: 600 clamp(8px, 1.1vw, 11px)/1.4 Arial, sans-serif;
  letter-spacing: .18em;
  color: #fff4df;
  text-transform: uppercase;
}
.date {
  margin: 30px 0 10px;
  color: #442412;
  font: 500 clamp(18px, 3vw, 29px)/1.3 Georgia, "Times New Roman", serif;
  letter-spacing: .18em;
}
.footer {
  margin: 0;
  color: #76502e;
  font: italic clamp(15px, 2.4vw, 22px)/1.5 Georgia, "Times New Roman", serif;
  letter-spacing: .04em;
}
@media (max-width: 520px) {
  body { padding: 8px; }
  .poster { min-height: calc(100vh - 16px); padding: 35px 14px; }
  .logo { width: 86%; margin-bottom: 25px; }
  .divider { letter-spacing: .18em; font-size: 9px; gap: 8px; margin-bottom: 24px; }
  h1 { font-size: clamp(32px, 8.5vw, 48px); }
  .tagline { letter-spacing: .12em; margin-bottom: 25px; }
  .timer { gap: 6px; }
  .unit { border-radius: 11px; padding: 15px 2px 12px; }
  .number { font-size: clamp(27px, 8vw, 39px); }
  .label { margin-top: 9px; font-size: 7px; letter-spacing: .06em; }
  .date { margin-top: 25px; letter-spacing: .1em; }
}
@media (prefers-reduced-motion: no-preference) {
  .unit { animation: rise-in .7s ease both; }
  .unit:nth-child(2) { animation-delay: .08s; }
  .unit:nth-child(3) { animation-delay: .16s; }
  .unit:nth-child(4) { animation-delay: .24s; }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
}
</style>
</head>

  if (remaining <= 0) {
    Object.values(fields).forEach(field => field.textContent = "00");
    document.querySelector("h1").innerHTML = 'ЭТОТ МОМЕНТ <span class="second">НАСТАЛ<span class="gold-text">!</span></span>';
    document.getElementById("footer").textContent = "Добро пожаловать!";
    clearInterval(timerInterval);
    return;
  }

  fields.days.textContent = String(Math.floor(remaining / 86400000)).padStart(2, "0");
  fields.hours.textContent = String(Math.floor(remaining / 3600000) % 24).padStart(2, "0");
  fields.minutes.textContent = String(Math.floor(remaining / 60000) % 60).padStart(2, "0");
  fields.seconds.textContent = String(Math.floor(remaining / 1000) % 60).padStart(2, "0");
}
updateCountdown();
const timerInterval = setInterval(updateCountdown, 1000);
</script>
</body>
</html>
